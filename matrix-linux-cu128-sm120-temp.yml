# TEMP: single-row matrix to validate sm_120 (Blackwell, CC 12.0)
# compiles under CUDA 12.8 via build_one.py before adding "12.0" to
# cuda_arch_list across the real cu128 and cu132 matrices. Delete this
# file (and build-linux-cu128-sm120-temp.yml) once validated.

builds:
  - name: py310-torch2110-cu128-linux-sm120
    python: "3.10"
    torch: "2.11.0"
    torchvision: "0.26.0"
    cuda: "12.8"
    pytorch3d: "0.7.9"
    os: ubuntu-22.04
    arch: manylinux_2_28_x86_64
    container: "pytorch/manylinux2_28-builder:cuda12.8"
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0;12.0"
