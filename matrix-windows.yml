# Build matrix for Windows pytorch3d wheels.
# Each row produces exactly one wheel.
#
# Pairings (torch, CUDA) MUST match what download.pytorch.org/whl/<cu*>
# actually publishes — if pip can't install the requested
# torch==X+cu<Y> at build time, the row fails immediately. When bumping
# versions, check https://download.pytorch.org/whl/torch/ first.
#
# Fields:
#   python         - cpython version
#   torch          - exact torch version to build against
#   torchvision    - matching torchvision (must exist for the same torch+cu)
#   cuda           - CUDA version like "12.9" (no "cpu" here; macOS handles that)
#   pytorch3d      - pytorch3d release tag (without leading v)
#   os             - github runner label
#   arch           - wheel platform tag
#   msvc_toolset   - "" for runner default (v143/VS2022). Match the toolset
#                    PyTorch's own wheels were built with:
#                      torch <= 2.5 -> "14.29"
#                      torch >= 2.6 -> ""  (v143 needed for -std=c++20)
#   cuda_arch_list - TORCH_CUDA_ARCH_LIST passed to nvcc.
#                      CUDA 12.x: sm_70..sm_90
#                      CUDA 13.x: sm_75..sm_90 (sm_60/sm_70 dropped)

builds:
  # --- torch 2.8.0 + CUDA 12.9 -------------------------------------------
  - name: py310-torch280-cu129-win
    python: "3.10"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "12.9"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  - name: py311-torch280-cu129-win
    python: "3.11"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "12.9"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  - name: py312-torch280-cu129-win
    python: "3.12"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "12.9"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  - name: py313-torch280-cu129-win
    python: "3.13"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "12.9"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  # --- torch (latest) + CUDA 13.2 ----------------------------------------
  # PLACEHOLDER: torch 2.12.0 paired with cu132. Verify against
  # download.pytorch.org/whl/cu132/ — bump if upstream ships a newer
  # stable for cu132.
  - name: py310-torch2120-cu132-win
    python: "3.10"
    torch: "2.12.0"
    torchvision: "0.27.0"
    cuda: "13.2"
    pytorch3d: "0.7.9"
    os: windows-2022
