# Build matrix for Linux pytorch3d wheels.
# Each row produces exactly one wheel.
#
# Linux wheels MUST be manylinux-compatible to be installable across
# distros — so the build runs inside a manylinux container with CUDA
# pre-installed (see .github/workflows/build-linux.yml). The `container`
# field selects the image per row.
#
# Pairings (torch, CUDA) must match what download.pytorch.org/whl/<cu*>
# publishes. Containers and CUDA version should match too — using the
# pytorch/manylinux2_28-builder family because it tracks PyTorch's own
# release CI.
#
# Fields:
#   python         - cpython version
#   torch          - exact torch version
#   torchvision    - matching torchvision
#   cuda           - CUDA version like "12.9"
#   pytorch3d      - pytorch3d release tag (without leading v)
#   os             - github runner host (the container is what actually
#                    builds; the host just runs Docker)
#   arch           - wheel platform tag (manylinux_2_28_x86_64)
#   container      - Docker image used to build
#   cuda_arch_list - TORCH_CUDA_ARCH_LIST

builds:
  # --- torch 2.8.0 + CUDA 12.9 -------------------------------------------
  - name: py310-torch280-cu129-linux
    python: "3.10"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "12.9"
    pytorch3d: "0.7.9"
    os: ubuntu-22.04
    arch: manylinux_2_28_x86_64
    container: "pytorch/manylinux2_28-builder:cuda12.9"
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  - name: py311-torch280-cu129-linux
    python: "3.11"
    torch: "2.8.0"
