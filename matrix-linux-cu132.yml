# EXPERIMENTAL: Linux + CUDA 13.2 builds.
#
# CUDA 13 flipped the default for -static-global-template-stub to true,
# which gave pulsar's explicit template instantiations hidden visibility
# without emitting their definitions ("hidden symbol ... isn't defined"
# at link). build_one.py now passes -static-global-template-stub=false
# via NVCC_PREPEND_FLAGS when CUDA major >= 13. See:
#   https://developer.nvidia.com/blog/cuda-c-compiler-updates-impacting-elf-visibility-and-linkage/
#
# Lives in a separate file (and the workflow defaults to publish=false)
# until a green run confirms the fix works end-to-end. Promote rows to
# matrix-linux.yml after verification.

builds:
  - name: py310-torch2120-cu132-linux
    python: "3.10"
    torch: "2.12.0"
    torchvision: "0.27.0"
    cuda: "13.2"
    pytorch3d: "0.7.9"
    os: ubuntu-22.04
    arch: manylinux_2_28_x86_64
    container: "pytorch/manylinux2_28-builder:cuda13.2"
    cuda_arch_list: "7.5;8.0;8.6;8.9;9.0"

  - name: py311-torch2120-cu132-linux
    python: "3.11"
    torch: "2.12.0"
