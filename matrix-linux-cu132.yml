# EXPERIMENTAL: Linux + CUDA 13.2 builds.
#
# Currently broken: pulsar's `_C.so` link step fails with
# "hidden symbol ... isn't defined" errors — the `<true>`/DYN template
# instantiations of pulsar::Renderer::{calc_signature,calc_gradients,
# fill_bg,render,...} are declared with hidden visibility but never
# emitted as defined symbols under CUDA 13's compilation model. Same
# failure mode as Windows cu132.
#
# Lives in a separate file so iterating on this doesn't disturb the
# stable cu129 wheels in matrix-linux.yml. The matching workflow
# (build-linux-cu132.yml) defaults to publish=false.
#
# Resolution path: wait for pytorch3d upstream to fix pulsar for
# CUDA 13, OR patch pytorch3d setup.py to disable pulsar entirely and
# ship a degraded wheel.

builds:
  - name: py310-torch2120-cu132-linux
    python: "3.10"
    torch: "2.12.0"
    torchvision: "0.27.0"
    cuda: "13.2"
    pytorch3d: "0.7.9"
    os: ubuntu-22.04
    arch: manylinux_2_28_x86_64
    container: "pytorch/manylinux2_28-builder:cuda13.2"
    cuda_arch_list: "7.5;8.0;8.6;8.9;9.0"

  - name: py311-torch2120-cu132-linux
    python: "3.11"
    torch: "2.12.0"
