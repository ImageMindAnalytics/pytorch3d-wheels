# Windows + CUDA 13.2 builds.
#
# Builds successfully with build_one.py's -static-global-template-stub=false
# (plus /Zc:preprocessor for MSVC's CCCL headers), set via
# NVCC_PREPEND_FLAGS when CUDA major >= 13. See:
#   https://developer.nvidia.com/blog/cuda-c-compiler-updates-impacting-elf-visibility-and-linkage/
#
# Kept in a separate matrix/workflow for now so the cu132 build matrix
# can be iterated on independently. Once stable, these rows can be
# merged into matrix-windows.yml.

builds:
  - name: py310-torch2120-cu132-win
    python: "3.10"
    torch: "2.12.0"
    torchvision: "0.27.0"
    cuda: "13.2"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.5;8.0;8.6;8.9;9.0"

  - name: py311-torch2120-cu132-win
    python: "3.11"
    torch: "2.12.0"
    torchvision: "0.27.0"
